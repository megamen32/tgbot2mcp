services:
  tgbot2mcp:
    build: .
    env_file:
      - .env
    volumes:
      - tgbot2mcp-data:/data
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    # Login:  docker compose run tgbot2mcp login
    # Serve:  docker compose run tgbot2mcp serve @SomeBot --transport http --host 0.0.0.0 --port 8080

volumes:
  tgbot2mcp-data:
