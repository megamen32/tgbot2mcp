<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#229ED9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Title -->
  <text x="640" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white" letter-spacing="-1">tgbot2mcp</text>
  <text x="640" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Any Telegram Bot → MCP Server in seconds</text>

  <!-- Flow diagram -->
  <!-- Telegram Bot box -->
  <g transform="translate(120, 240)">
    <rect width="200" height="160" rx="16" fill="#1e293b" stroke="url(#tg)" stroke-width="2"/>
    <!-- Telegram icon simplified -->
    <circle cx="100" cy="55" r="28" fill="url(#tg)" opacity="0.15"/>
    <path d="M88 55 L100 45 L112 55 L100 65 Z" fill="url(#tg)"/>
    <text x="100" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white">Telegram Bot</text>
    <text x="100" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">@AnyBot</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(340, 310)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="80,-5 90,0 80,5" fill="#38bdf8"/>
    <text x="45" y="-12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">MTProto</text>
  </g>

  <!-- tgbot2mcp core box -->
  <g transform="translate(440, 220)">
    <rect width="240" height="200" rx="16" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="32" rx="6" fill="#0f172a"/>
    <text x="120" y="41" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#38bdf8">tgbot2mcp</text>
    
    <!-- Internal components -->
    <text x="30" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Discovery (DFS)</text>
    <rect x="20" y="85" width="80" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>
    
    <text x="30" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Conversation Mgr</text>
    <rect x="20" y="119" width="120" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
    
    <text x="30" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Telethon Session</text>
    <rect x="20" y="153" width="100" height="4" rx="2" fill="#34d399" opacity="0.6"/>
    
    <text x="120" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Auto-discover capabilities</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(700, 310)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="80,-5 90,0 80,5" fill="#818cf8"/>
    <text x="45" y="-12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">MCP</text>
  </g>

  <!-- MCP Server box -->
  <g transform="translate(800, 240)">
    <rect width="200" height="160" rx="16" fill="#1e293b" stroke="url(#mcp)" stroke-width="2"/>
    <circle cx="100" cy="55" r="28" fill="url(#mcp)" opacity="0.15"/>
    <text x="100" y="60" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="url(#mcp)">{ }</text>
    <text x="100" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white">MCP Server</text>
    <text x="100" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">6 tools + dynamic</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(1020, 310)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#ai)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="60,-5 70,0 60,5" fill="#34d399"/>
  </g>

  <!-- AI Clients box -->
  <g transform="translate(1100, 260)">
    <rect width="140" height="120" rx="16" fill="#1e293b" stroke="url(#ai)" stroke-width="2"/>
    <text x="70" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">AI Clients</text>
    <text x="70" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Claude</text>
    <text x="70" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">GPT / Gemini</text>
  </g>

  <!-- Bottom features -->
  <g transform="translate(140, 480)">
    <rect width="160" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">No Bot Token Needed</text>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">User session (MTProto)</text>
  </g>
  
  <g transform="translate(330, 480)">
    <rect width="160" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8">Auto Discovery</text>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">DFS state crawl</text>
  </g>

  <g transform="translate(520, 480)">
    <rect width="160" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">Dynamic Tools</text>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Per-command MCP tools</text>
  </g>

  <g transform="translate(710, 480)">
    <rect width="160" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">stdio + HTTP</text>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Any MCP transport</text>
  </g>

  <g transform="translate(900, 480)">
    <rect width="160" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f472b6">Docker Ready</text>
    <text x="80" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">One-command deploy</text>
  </g>
</svg>
